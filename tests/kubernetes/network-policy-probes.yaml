apiVersion: v1
kind: Pod
metadata:
  name: forge-netpol-probe
  namespace: development
  labels:
    app: forge-netpol-probe
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: forge-platform-api:batch3
      imagePullPolicy: Never
      command:
        - python
        - -c
      args:
        - import time; time.sleep(3600)
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        capabilities:
          drop:
            - ALL
---
