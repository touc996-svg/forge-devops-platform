fullnameOverride: apex-api

replicaCount: 1

image:
  repository: apex-mlops
  tag: forge-0.3.0
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  type: ClusterIP
  port: 8000

env:
  APEX_ENV: production
  APEX_ARTIFACT_DIR: /runtime-artifacts
  PYTHONDONTWRITEBYTECODE: "1"
  HOME: /tmp
  TMPDIR: /tmp

secretEnv:
  name: APEX_API_KEY
  secretName: apex-api-auth
  secretKey: APEX_API_KEY

probes:
  startup:
    path: /health/live
    periodSeconds: 5
    failureThreshold: 60
  liveness:
    path: /health/live
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /health/ready
    periodSeconds: 5
    failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1536Mi

tmpSizeLimit: 128Mi

extraVolumes:
  - name: model-artifacts
    emptyDir:
      sizeLimit: 512Mi

extraVolumeMounts:
  - name: model-artifacts
    mountPath: /runtime-artifacts

initContainers:
  - name: initialize-model-artifacts
    image: apex-mlops:forge-0.3.0
    imagePullPolicy: IfNotPresent
    command:
      - sh
      - -c
      - cp -R /app/artifacts/. /runtime-artifacts/
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      capabilities:
        drop:
          - ALL
    volumeMounts:
      - name: model-artifacts
        mountPath: /runtime-artifacts
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
