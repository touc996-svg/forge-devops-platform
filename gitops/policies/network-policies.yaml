# Allow only selected development/staging namespaces to call FORGE API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-approved-environments-to-forge-api
  namespace: forge-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: forge-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              forge.io/environment: development
        - namespaceSelector:
            matchLabels:
              forge.io/environment: staging
      ports:
        - protocol: TCP
          port: 8000
