name: FORGE CI CD and Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ----------------------------------------
  # QUALITY AND CONTAINER VALIDATION
  # ----------------------------------------

  quality:
    name: Code Quality and Container Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check portal/forge-api

      - name: Ruff format validation
        run: ruff format --check portal/forge-api

      - name: Run tests
        run: |
          PYTHONPATH=portal/forge-api pytest portal/forge-api/tests -v

      - name: Build Docker image
        run: |
          docker build --pull \
            --tag forge-platform-api:${{ github.sha }} .

      - name: Container smoke test
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="forge-platform-api:${GITHUB_SHA}"

          docker run -d \
            --rm \
            --name forge-api-smoke \
            --publish 127.0.0.1:18081:8000 \
            "$IMAGE"

          cleanup() {
            docker stop forge-api-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:18081/health; then
              echo ""
              echo "Container smoke test passed."
              exit 0
            fi

            sleep 2
          done

          docker logs forge-api-smoke
          echo "Container did not become healthy."
          exit 1

  # ----------------------------------------
  # SECURITY GATES
  # ----------------------------------------

  security:
    name: DevSecOps Security Gates
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install security audit tool
        run: |
          python -m pip install --upgrade pip pip-audit

      - name: Python dependency audit
        run: |
          pip-audit \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Gitleaks secret scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Trivy filesystem security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # ----------------------------------------
  # PUBLISH ONLY AFTER ALL GATES PASS
  # ----------------------------------------

  publish:
    name: Publish Secure Image to GHCR

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - quality
      - security

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Authenticate to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
